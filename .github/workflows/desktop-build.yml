# Reusable "prepare" half of the desktop release: build the Tauri desktop
# packages (Windows + macOS), run the install/launch/chat UI verification,
# and upload the installers + updater sidecars as run artifacts.
#
# This workflow performs NO publishing. It is called by release.yml during the
# prepare phase (pinned to the release commit via `ref`), and can also be run
# standalone via workflow_dispatch to validate a packaging change.
#
# The matching publish half lives in desktop-publish.yml.

name: Desktop Build (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref/SHA to build (pins the build to the release commit)"
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref/SHA to build (default: this workflow's ref)"
        type: string
        required: false
        default: ""
      windows_only:
        description: "Run only the Windows build and portable verification"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build-tauri-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Get version
        id: version
        uses: ./.github/actions/get-version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify GO CLAW repository and runtime contract
        run: python scripts/verify/go_claw_maintenance_contract.py --repo-root .

      - name: Install packaging helper dependencies
        run: python -m pip install packaging python-dotenv cryptography

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: console/src-tauri

      - name: Install NSIS
        uses: negrutiu/nsis-install@v2

      - name: Clean dist directory
        shell: pwsh
        run: |
          if (Test-Path dist) {
            Remove-Item -Recurse -Force dist
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null

      - name: Validate signed GO CLAW build settings
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          foreach ($name in @(
            "TAURI_SIGNING_PRIVATE_KEY",
            "TAURI_SIGNING_PRIVATE_KEY_PASSWORD",
            "TAURI_UPDATER_PUBKEY"
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "$name is required for the signed Windows build"
            }
          }
          Write-Host "Signed Windows build settings are present"

      - name: Validate delivery key and materialize GO CLAW provisioning
        shell: pwsh
        env:
          GO_CLAW_DASHSCOPE_API_KEY: ${{ secrets.GO_CLAW_DASHSCOPE_API_KEY }}
          GO_CLAW_PROVISION_URL: ${{ secrets.GO_CLAW_PROVISION_URL }}
          GO_CLAW_PROVISION_HMAC_SECRET: ${{ secrets.GO_CLAW_PROVISION_HMAC_SECRET }}
        run: |
          foreach ($name in @(
            "GO_CLAW_DASHSCOPE_API_KEY",
            "GO_CLAW_PROVISION_URL",
            "GO_CLAW_PROVISION_HMAC_SECRET"
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "$name is required for the GO CLAW Full ZIP"
            }
          }
          if ($env:GO_CLAW_PROVISION_URL -ne "https://goclaw.host:8443/go-claw/provision") {
            throw "GO_CLAW_PROVISION_URL does not match the production provisioning endpoint"
          }
          if ($env:GO_CLAW_PROVISION_HMAC_SECRET.Length -lt 16) {
            throw "GO_CLAW_PROVISION_HMAC_SECRET is structurally invalid"
          }
          $configDir = "scripts/pack-tauri/GO-CLAW-Config"
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null
          if (Test-Path -LiteralPath "$configDir/credentials.json") {
            throw "credentials.json must not be staged with provisioning"
          }
          $payload = [ordered]@{
            provisionUrl = $env:GO_CLAW_PROVISION_URL
            hmacSecret = $env:GO_CLAW_PROVISION_HMAC_SECRET
          }
          [IO.File]::WriteAllText(
            "$configDir/provision.json",
            ($payload | ConvertTo-Json -Depth 2),
            [Text.UTF8Encoding]::new($false)
          )
          $headers = @{ Authorization = "Bearer $env:GO_CLAW_DASHSCOPE_API_KEY" }
          $modelsUrl = "https://goclaw.host:8443/v1/models"
          $models = Invoke-RestMethod `
            -Method Get `
            -Uri $modelsUrl `
            -Headers $headers `
            -TimeoutSec 30
          $modelIds = @($models.data | ForEach-Object { $_.id })
          $requiredModels = @(
            "deepseek-v4-flash-0731",
            "qwen3.7-plus",
            "qwen3.8-max",
            "qwen-image-3.0-pro",
            "happyhorse-1.1-t2v",
            "happyhorse-1.1-i2v",
            "happyhorse-1.1-r2v"
          )
          foreach ($modelId in $requiredModels) {
            if ($modelIds -notcontains $modelId) {
              throw "GO CLAW credential preflight is missing required model: $modelId"
            }
          }
          Write-Host "GO CLAW seven-model credential preflight passed"
          Write-Host "Full ZIP provisioning staged without displaying secrets"

      - name: Build Tauri Windows package
        shell: pwsh
        env:
          # Authenticate the python-build-standalone release lookup in
          # stage_python_runtime.py to avoid anonymous API rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          TAURI_UPDATER_ENDPOINTS: ${{ vars.TAURI_UPDATER_ENDPOINTS }}
        run: ./scripts/pack-tauri/build_win_pyinstaller.ps1

      - name: Stage Tauri Windows installer and updater assets
        shell: pwsh
        run: |
          $bundleDir = "console/src-tauri/target/release/bundle/nsis"
          $output = "dist/GO-CLAW-Setup-${{ steps.version.outputs.version }}-Windows-x64.exe"
          $installers = @(Get-ChildItem -LiteralPath $bundleDir -Filter "*-setup.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)"
          }

          $signature = "$($installers[0].FullName).sig"
          if (-not (Test-Path -LiteralPath $signature)) {
            throw "Signed Windows installer sidecar is required: $signature"
          }
          python scripts/pack-tauri/generate_update_manifest.py stage `
            --bundle-dir $bundleDir `
            --pattern '*-setup.exe' `
            --target windows-x86_64 `
            --output $output `
            --pubkey-config console/src-tauri/tauri.version.conf.json
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to stage signed Windows updater assets"
          }

      - name: Verify desktop (Tauri Windows Portable)
        timeout-minutes: 15
        uses: ./.github/actions/verify-tauri-windows-portable
        with:
          dashscope-api-key: ${{ secrets.QWENPAW_DASHSCOPE_API_KEY }}

      - name: Upload portable verify logs (Tauri Windows)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portable-verify-logs-tauri-windows-${{ steps.version.outputs.version }}
          path: |
            ${{ runner.temp }}/portable-verify-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop desktop server (Tauri Windows Portable)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Get-Process -Name "GO-CLAW-Portable", "qwenpaw-desktop", "qwenpaw-backend" `
            -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          subst P: /D 2>$null
          subst Q: /D 2>$null
          subst R: /D 2>$null
          subst S: /D 2>$null
          subst T: /D 2>$null
          subst U: /D 2>$null
          exit 0

      - name: Require desktop readiness evidence (Tauri Windows)
        if: always()
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "verify-screenshots"
          foreach ($name in @("desktop-content-ready.png")) {
            $path = Join-Path $evidence $name
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required desktop readiness evidence missing: $path"
            }
          }

      - name: Upload verify screenshots (Tauri Windows)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verify-screenshots-tauri-windows-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/verify-screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build signed component update and legacy A/B Bridge
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $commit = (git rev-parse HEAD).Trim()
          $stage = Get-ChildItem -LiteralPath "dist" -Directory -Filter "GO-CLAW-Portable-*-Windows-x64" |
            Select-Object -First 1
          if (-not $stage) { throw "portable staging directory not found" }
          $baseUrl = "https://github.com/GresonKwan/GO-Claw-2.0/releases/download/v$version"
          $indexUrl = "$baseUrl/release-index-v2.json"
          $manifestUrl = "$baseUrl/windows-release-v2.json"
          $work = "dist/v2-work"
          $public = "dist/v2-assets"
          if (Test-Path $work) { Remove-Item -LiteralPath $work -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $public | Out-Null

          cargo build --manifest-path console/src-tauri/Cargo.toml --release --bin go-claw-update-engine
          if ($LASTEXITCODE -ne 0) { throw "standalone update engine build failed" }
          $engine = (Resolve-Path "console/src-tauri/target/release/go-claw-update-engine.exe").Path

          python scripts/pack-tauri/build_component_packages.py `
            --root $stage.FullName `
            --output $work `
            --base-url $baseUrl `
            --trusted-host github.com
          if ($LASTEXITCODE -ne 0) { throw "component packaging failed" }
          foreach ($archive in Get-ChildItem $work -File -Filter "*.zip") {
            npm --prefix console exec -- tauri signer sign $archive.FullName
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$($archive.FullName).sig")) {
              throw "component signing failed: $($archive.Name)"
            }
          }
          python scripts/pack-tauri/assemble_component_manifest.py `
            --draft "$work/components.unsigned.json" `
            --pubkey-config "console/src-tauri/tauri.conf.json" `
            --version $version `
            --commit $commit `
            --channel staging `
            --trusted-host github.com `
            --output "$work/windows-release-v2.json"
          if ($LASTEXITCODE -ne 0) { throw "component manifest assembly failed" }
          npm --prefix console exec -- tauri signer sign "$work/windows-release-v2.json"
          if ($LASTEXITCODE -ne 0) { throw "component manifest signing failed" }
          $manifestHash = (Get-FileHash "$work/windows-release-v2.json" -Algorithm SHA256).Hash.ToLowerInvariant()

          Copy-Item "console/src-tauri/nsis/go-claw-update-bridge.nsi" "$work/bridge.nsi"
          Push-Location $work
          makensis /INPUTCHARSET UTF8 `
            "/DGO_CLAW_VERSION=$version" `
            "/DGO_CLAW_INDEX_URL=$indexUrl" `
            "/DGO_CLAW_TARGET_MANIFEST=$manifestHash" `
            "/DGO_CLAW_ENGINE=$engine" `
            "bridge.nsi"
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw "Bridge makensis failed" }
          Pop-Location
          ./scripts/verify/test_portable_update_bridge.ps1 `
            -NsisScript "console/src-tauri/nsis/go-claw-update-bridge.nsi"
          $setup = (Resolve-Path "$work/GO-CLAW-Update-$version-setup.exe").Path
          npm --prefix console exec -- tauri signer sign $setup
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$setup.sig")) {
            throw "Bridge signing failed"
          }
          python scripts/pack-tauri/build_go_claw_update_manifest.py `
            --version $version `
            --setup $setup `
            --base-url $baseUrl `
            --build-commit $commit `
            --notes "GO CLAW $version" `
            --output "dist/latest.json"
          if ($LASTEXITCODE -ne 0) { throw "legacy manifest generation failed" }

          $config = Get-Content "console/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          [IO.File]::WriteAllText(
            "$work/updater.pub",
            $config.plugins.updater.pubkey,
            [Text.ASCIIEncoding]::new()
          )
          python scripts/pack-tauri/build_release_index_v2.py `
            --manifest "$work/windows-release-v2.json" `
            --manifest-url $manifestUrl `
            --bridge $setup `
            --bridge-url "$baseUrl/$([IO.Path]::GetFileName($setup))" `
            --pubkey-file "$work/updater.pub" `
            --legacy-latest "dist/latest.json" `
            --output "$work/release-index-v2.json" `
            --trusted-host github.com
          if ($LASTEXITCODE -ne 0) { throw "release index assembly failed" }
          npm --prefix console exec -- tauri signer sign "$work/release-index-v2.json"
          if ($LASTEXITCODE -ne 0) { throw "release index signing failed" }
          python scripts/pack-tauri/build_release_catalog_v2.py `
            --release "$work/release-index-v2.json" $indexUrl `
            --pubkey-file "$work/updater.pub" `
            --trusted-host github.com `
            --output "$work/release-catalog-v2.json"
          if ($LASTEXITCODE -ne 0) { throw "release catalog assembly failed" }
          npm --prefix console exec -- tauri signer sign "$work/release-catalog-v2.json"
          if ($LASTEXITCODE -ne 0) { throw "release catalog signing failed" }

          Copy-Item $setup, "$setup.sig" -Destination dist
          foreach ($pattern in @(
            "*.zip", "*.zip.sig", "windows-release-v2.json", "windows-release-v2.json.sig",
            "release-index-v2.json", "release-index-v2.json.sig",
            "release-catalog-v2.json", "release-catalog-v2.json.sig"
          )) {
            Copy-Item "$work/$pattern" -Destination $public
          }

      - name: Upload Tauri Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-claw-windows-installer-${{ steps.version.outputs.version }}
          path: |
            dist/GO-CLAW-Setup-*-Windows-x64.exe
            dist/GO-CLAW-Setup-*-Windows-x64.exe.sig
          if-no-files-found: error

      - name: Download and validate offline WebView2 runtime
        shell: pwsh
        run: |
          $vendorDir = "dist/vendor/WebView2"
          New-Item -ItemType Directory -Force -Path $vendorDir | Out-Null
          $installer = Join-Path $vendorDir "MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
          Invoke-WebRequest `
            -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile $installer `
            -MaximumRedirection 10
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne "Valid") {
            throw "WebView2 Authenticode signature is not valid: $($signature.Status)"
          }
          if ($signature.SignerCertificate.Subject -notlike "*Microsoft Corporation*") {
            throw "WebView2 signer is not Microsoft Corporation"
          }
          "WEBVIEW2_AUTHENTICODE_SUBJECT=$($signature.SignerCertificate.Subject)" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $digest = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Validated Microsoft WebView2 runtime SHA-256: $digest"

      - name: Assemble canonical GO CLAW Full ZIP
        shell: pwsh
        run: |
          $portableStages = @(Get-ChildItem dist -Directory -Filter "GO-CLAW-Portable-*-Windows-x64")
          if ($portableStages.Count -ne 1) {
            throw "Expected exactly one portable stage, found $($portableStages.Count)"
          }
          $sourceCommit = (git rev-parse HEAD).Trim()
          $sourceEpoch = (git show -s --format=%ct HEAD).Trim()
          $env:SOURCE_DATE_EPOCH = $sourceEpoch
          python scripts/pack-tauri/build_windows_full_bundle.py `
            --version "${{ steps.version.outputs.version }}" `
            --source-commit $sourceCommit `
            --portable-stage $portableStages[0].FullName `
            --webview2-installer "dist/vendor/WebView2/MicrosoftEdgeWebView2RuntimeInstallerX64.exe" `
            --pubkey-config "console/src-tauri/tauri.conf.json" `
            --dist "dist"
          if ($LASTEXITCODE -ne 0) { throw "Full ZIP assembly failed" }
          if (-not (Test-Path -LiteralPath "dist/GO-CLAW-Windows-x64-Full.zip")) {
            throw "Canonical GO CLAW Full ZIP was not produced"
          }

      - name: Remove build-time provisioning source
        if: always()
        shell: pwsh
        run: |
          $path = "scripts/pack-tauri/GO-CLAW-Config/provision.json"
          Remove-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue
          if (Test-Path -LiteralPath $path) {
            throw "Failed to remove build-time provisioning source"
          }

      - name: Verify signed Windows release contract
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem dist -File -Filter "GO-CLAW-Setup-*-Windows-x64.exe")
          $updates = @(Get-ChildItem dist -File -Filter "GO-CLAW-Update-*-setup.exe")
          if ($installers.Count -ne 1 -or $updates.Count -ne 1) {
            throw "Expected exactly one installer and one update package"
          }
          python scripts/verify/windows_release_contract.py `
            --full-zip "dist/GO-CLAW-Windows-x64-Full.zip" `
            --installer $installers[0].FullName `
            --installer-signature "$($installers[0].FullName).sig" `
            --update $updates[0].FullName `
            --update-signature "$($updates[0].FullName).sig" `
            --latest-json "dist/latest.json" `
            --pubkey-config "console/src-tauri/tauri.conf.json" `
            --update-payload "dist/v2-assets" `
            --webview2-authenticode-subject $env:WEBVIEW2_AUTHENTICODE_SUBJECT
          if ($LASTEXITCODE -ne 0) { throw "Windows release contract verification failed" }

      - name: Generate public Windows SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem dist -File -Filter "GO-CLAW-Setup-*-Windows-x64.exe"
            Get-ChildItem dist -File -Filter "GO-CLAW-Setup-*-Windows-x64.exe.sig"
            Get-ChildItem dist -File -Filter "GO-CLAW-Update-*-setup.exe"
            Get-ChildItem dist -File -Filter "GO-CLAW-Update-*-setup.exe.sig"
            Get-Item "dist/latest.json"
            Get-ChildItem "dist/v2-assets" -File
          ) | Sort-Object Name
          if ($files.Count -lt 19) {
            throw "Expected signed v2 component release inputs, found only $($files.Count)"
          }
          $lines = foreach ($file in $files) {
            $digest = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($file.Name)"
          }
          [IO.File]::WriteAllLines(
            (Join-Path (Resolve-Path dist) "SHA256SUMS.txt"),
            $lines,
            [Text.UTF8Encoding]::new($false)
          )

      - name: Upload single GO CLAW Full ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GO-CLAW-Windows-x64-Full-${{ steps.version.outputs.version }}
          path: dist/GO-CLAW-Windows-x64-Full.zip
          if-no-files-found: error

      - name: Upload Tauri Windows updater metadata
        uses: actions/upload-artifact@v4
        with:
          name: tauri-updater-meta-windows
          path: |
            dist/QwenPaw-Tauri-*-Windows-setup.exe.sig
            dist/tauri-windows-x86_64-updater.json

      - name: Upload GO CLAW update package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-claw-update-package-${{ steps.version.outputs.version }}
          path: |
            dist/GO-CLAW-Update-*-setup.exe
            dist/GO-CLAW-Update-*-setup.exe.sig
            dist/latest.json
            dist/SHA256SUMS.txt
            dist/v2-assets/*
          if-no-files-found: error

  build-tauri-macos:
    if: ${{ inputs.windows_only != true }}
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Get version
        id: version
        uses: ./.github/actions/get-version

      - name: Set up Python
        uses: actions/setup-python@v5
        env:
          PIP_NO_CACHE_DIR: "1"
        with:
          python-version: "3.11"

      - name: Install packaging helper dependencies
        run: python -m pip install packaging

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: console/src-tauri

      - name: Clean dist directory
        run: rm -rf dist && mkdir -p dist

      - name: Build Tauri macOS package
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          # Authenticate the python-build-standalone release lookup in
          # stage_python_runtime.py to avoid anonymous API rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          TAURI_UPDATER_ENDPOINTS: ${{ vars.TAURI_UPDATER_ENDPOINTS }}
        run: |
          chmod +x scripts/pack-tauri/build_macos_pyinstaller.sh
          bash scripts/pack-tauri/build_macos_pyinstaller.sh

      - name: Verify desktop (Tauri macOS)
        timeout-minutes: 10
        uses: ./.github/actions/verify-tauri-macos
        with:
          dashscope-api-key: ${{ secrets.QWENPAW_DASHSCOPE_API_KEY }}

      - name: Stop desktop server (Tauri macOS)
        if: always()
        run: |
          # Kill the Tauri shell and its sidecar subprocess.
          pkill -f "GO CLAW" 2>/dev/null || true
          pkill -f "qwenpaw-backend" 2>/dev/null || true
          sleep 2
          pkill -9 -f "GO CLAW" 2>/dev/null || true
          pkill -9 -f "qwenpaw-backend" 2>/dev/null || true
          # Best-effort: kill anything sitting on the detected port.
          if [ -n "${BASE_URL:-}" ]; then
            PORT="${BASE_URL##*:}"
            lsof -ti:"$PORT" | xargs kill 2>/dev/null || true
          fi
          rm -rf dist/verify-tauri

      - name: Upload desktop verify logs (Tauri macOS)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verify-logs-tauri-macos-${{ steps.version.outputs.version }}
          path: |
            ${{ runner.temp }}/qwenpaw-desktop-stdout.log
            ${{ runner.temp }}/qwenpaw-desktop-stderr.log
            ~/Library/Logs/com.qwenpaw.desktop/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload verify screenshots (Tauri macOS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verify-screenshots-tauri-macos-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/verify-screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Tauri macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: QwenPaw-Desktop-Tauri-macOS-${{ steps.version.outputs.version }}
