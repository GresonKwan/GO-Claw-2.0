# Reusable "prepare" half of the desktop release: build the Tauri desktop
# packages (Windows + macOS), run the install/launch/chat UI verification,
# and upload the installers + updater sidecars as run artifacts.
#
# This workflow performs NO publishing. It is called by release.yml during the
# prepare phase (pinned to the release commit via `ref`), and can also be run
# standalone via workflow_dispatch to validate a packaging change.
#
# The matching publish half lives in desktop-publish.yml.

name: Desktop Build (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref/SHA to build (pins the build to the release commit)"
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref/SHA to build (default: this workflow's ref)"
        type: string
        required: false
        default: ""
      windows_only:
        description: "Run only the Windows build and portable verification"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build-tauri-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Get version
        id: version
        uses: ./.github/actions/get-version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging helper dependencies
        run: python -m pip install packaging

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: console/src-tauri

      - name: Install NSIS
        uses: negrutiu/nsis-install@v2

      - name: Clean dist directory
        shell: pwsh
        run: |
          if (Test-Path dist) {
            Remove-Item -Recurse -Force dist
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null

      - name: Materialize optional GO CLAW batch credentials
        shell: pwsh
        env:
          GO_CLAW_LLM_API_KEY: ${{ secrets.GO_CLAW_LLM_API_KEY }}
          GO_CLAW_DASHSCOPE_API_KEY: ${{ secrets.GO_CLAW_DASHSCOPE_API_KEY }}
        run: |
          if (
            [string]::IsNullOrWhiteSpace($env:GO_CLAW_LLM_API_KEY) -or
            [string]::IsNullOrWhiteSpace($env:GO_CLAW_DASHSCOPE_API_KEY)
          ) {
            Write-Host "Batch credentials not configured; packaging template only"
          } else {
            $configDir = "scripts/pack-tauri/GO-CLAW-Config"
            New-Item -ItemType Directory -Force -Path $configDir | Out-Null
            $payload = [ordered]@{
              schemaVersion = 1
              batchId = "go-claw-20260815-batch-01"
              llm = [ordered]@{
                providerId = "deepseek"
                modelId = "deepseek-v4-flash"
                baseUrl = "https://api.tokenbyte.ai/v1"
                apiKey = $env:GO_CLAW_LLM_API_KEY
              }
              dashscope = [ordered]@{
                compatibleBaseUrl = "https://llm-y0my8cwttd6ojm5b.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
                apiKey = $env:GO_CLAW_DASHSCOPE_API_KEY
              }
            }
            $json = $payload | ConvertTo-Json -Depth 4
            [IO.File]::WriteAllText(
              "$configDir/credentials.json",
              $json,
              [Text.UTF8Encoding]::new($false)
            )
            $headers = @{
              Authorization = "Bearer $($payload.dashscope.apiKey)"
            }
            $modelsUrl = "$($payload.dashscope.compatibleBaseUrl.TrimEnd('/'))/models"
            $models = Invoke-RestMethod `
              -Method Get `
              -Uri $modelsUrl `
              -Headers $headers `
              -TimeoutSec 30
            $modelIds = @($models.data | ForEach-Object { $_.id })
            if ($modelIds -notcontains "qwen-image-3.0") {
              throw "DashScope credential is valid but qwen-image-3.0 is unavailable"
            }
            Write-Host "DashScope credential preflight passed"
            Write-Host "Batch credentials staged without displaying secret values"
          }

      - name: Materialize optional GO CLAW provision config
        shell: pwsh
        env:
          GO_CLAW_PROVISION_URL: ${{ secrets.GO_CLAW_PROVISION_URL }}
          GO_CLAW_PROVISION_HMAC_SECRET: ${{ secrets.GO_CLAW_PROVISION_HMAC_SECRET }}
        run: |
          if (
            [string]::IsNullOrWhiteSpace($env:GO_CLAW_PROVISION_URL) -or
            [string]::IsNullOrWhiteSpace($env:GO_CLAW_PROVISION_HMAC_SECRET)
          ) {
            Write-Host "Provision config not configured; skipping"
          } else {
            $configDir = "scripts/pack-tauri/GO-CLAW-Config"
            New-Item -ItemType Directory -Force -Path $configDir | Out-Null
            $payload = [ordered]@{
              provisionUrl = $env:GO_CLAW_PROVISION_URL
              hmacSecret = $env:GO_CLAW_PROVISION_HMAC_SECRET
            }
            [IO.File]::WriteAllText(
              "$configDir/provision.json",
              ($payload | ConvertTo-Json),
              [Text.UTF8Encoding]::new($false)
            )
            Write-Host "Provision config staged without displaying secret values"
          }

      - name: Build Tauri Windows package
        shell: pwsh
        env:
          # Authenticate the python-build-standalone release lookup in
          # stage_python_runtime.py to avoid anonymous API rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          TAURI_UPDATER_ENDPOINTS: ${{ vars.TAURI_UPDATER_ENDPOINTS }}
        run: ./scripts/pack-tauri/build_win_pyinstaller.ps1

      - name: Stage Tauri Windows installer and updater assets
        shell: pwsh
        run: |
          $bundleDir = "console/src-tauri/target/release/bundle/nsis"
          $output = "dist/QwenPaw-Tauri-${{ steps.version.outputs.version }}-Windows-setup.exe"
          $installers = @(Get-ChildItem -LiteralPath $bundleDir -Filter "*-setup.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)"
          }

          $signature = "$($installers[0].FullName).sig"
          if (Test-Path -LiteralPath $signature) {
            python scripts/pack-tauri/generate_update_manifest.py stage `
              --bundle-dir $bundleDir `
              --pattern '*-setup.exe' `
              --target windows-x86_64 `
              --output $output `
              --pubkey-config console/src-tauri/tauri.version.conf.json
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to stage signed Windows updater assets"
            }
          } else {
            Copy-Item -LiteralPath $installers[0].FullName -Destination $output
            Write-Warning "TAURI_SIGNING_PRIVATE_KEY is not configured; staged an unsigned test installer without updater metadata"
          }

      - name: Verify desktop (Tauri Windows Portable)
        timeout-minutes: 15
        uses: ./.github/actions/verify-tauri-windows-portable
        with:
          dashscope-api-key: ${{ secrets.QWENPAW_DASHSCOPE_API_KEY }}

      - name: Upload portable verify logs (Tauri Windows)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portable-verify-logs-tauri-windows-${{ steps.version.outputs.version }}
          path: |
            ${{ env.PORTABLE_ROOT }}/logs/
            ${{ env.PORTABLE_ROOT }}/data/desktop.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop desktop server (Tauri Windows Portable)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Get-Process -Name "GO-CLAW-Portable", "qwenpaw-desktop", "qwenpaw-backend" `
            -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          subst P: /D 2>$null
          subst Q: /D 2>$null
          subst R: /D 2>$null
          subst S: /D 2>$null
          subst T: /D 2>$null
          subst U: /D 2>$null
          exit 0

      - name: Verify desktop (Tauri Windows)
        timeout-minutes: 10
        uses: ./.github/actions/verify-tauri-windows
        with:
          dashscope-api-key: ${{ secrets.QWENPAW_DASHSCOPE_API_KEY }}

      - name: Stop desktop server (Tauri Windows)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          # Kill the Tauri shell and its sidecar subprocess by name.
          Get-Process -Name "qwenpaw-desktop" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name "qwenpaw-backend" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Get-Process -Name "qwenpaw-desktop" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name "qwenpaw-backend" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          exit 0

      - name: Upload desktop verify logs (Tauri Windows)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verify-logs-tauri-windows-${{ steps.version.outputs.version }}
          path: |
            ${{ runner.temp }}/qwenpaw-desktop-stdout.log
            ${{ runner.temp }}/qwenpaw-desktop-stderr.log
            ~/AppData/Local/com.qwenpaw.desktop/logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload verify screenshots (Tauri Windows)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verify-screenshots-tauri-windows-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/verify-screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build portable update package (NSIS)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $stage = Get-ChildItem -LiteralPath "dist" -Directory -Filter "GO-CLAW-Portable-*-Windows-x64" |
            Select-Object -First 1
          if (-not $stage) { throw "portable staging directory not found" }

          # 白名单：仅程序文件。绝不包含 GO-CLAW-Config（批次凭证）、
          # portable.json、data/secrets/logs/cache/backups/updates。
          $payload = "dist/payload"
          if (Test-Path $payload) { Remove-Item -Recurse -Force $payload }
          New-Item -ItemType Directory -Path $payload | Out-Null
          foreach ($item in @("GO-CLAW-Portable.exe", "binaries", "LICENSE", "README-PORTABLE.zh-CN.txt")) {
            Copy-Item -LiteralPath (Join-Path $stage.FullName $item) -Destination $payload -Recurse
          }
          $forbidden = @("GO-CLAW-Config", "portable.json", "data", "secrets", "logs", "cache", "backups", "updates")
          foreach ($item in $forbidden) {
            if (Test-Path (Join-Path $payload $item)) { throw "forbidden content in update payload: $item" }
          }

          Copy-Item "console/src-tauri/nsis/go-claw-update.nsi" "dist/update.nsi"
          Push-Location "dist"
          makensis "/DGO_CLAW_VERSION=$version" "update.nsi"
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw "makensis failed" }
          Pop-Location
          $setup = "dist/GO-CLAW-Update-$version-setup.exe"
          if (-not (Test-Path $setup)) { throw "update installer not produced" }
          $setup = (Resolve-Path -LiteralPath $setup).Path

          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            npm --prefix console exec -- tauri signer sign $setup
            if ($LASTEXITCODE -ne 0) { throw "tauri signer sign failed" }
            python scripts/pack-tauri/build_go_claw_update_manifest.py `
              --version $version `
              --setup $setup `
              --base-url "https://github.com/GresonKwan/GO-Claw-2.0/releases/latest/download" `
              --notes "GO CLAW $version" `
              --output "dist/latest.json"
            if ($LASTEXITCODE -ne 0) { throw "manifest generation failed" }
          } else {
            Write-Warning "TAURI_SIGNING_PRIVATE_KEY not configured; update installer stays unsigned, no latest.json"
          }

      - name: Upload Tauri Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: QwenPaw-Desktop-Tauri-Windows-${{ steps.version.outputs.version }}
          path: dist/QwenPaw-Tauri-*-Windows-setup.exe

      - name: Upload Tauri Windows portable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GO-CLAW-Portable-Windows-${{ steps.version.outputs.version }}
          path: |
            dist/GO-CLAW-Portable-*-Windows-x64.zip
            dist/GO-CLAW-Portable-*-Windows-x64.zip.sha256
          if-no-files-found: error

      - name: Upload Tauri Windows updater metadata
        uses: actions/upload-artifact@v4
        with:
          name: tauri-updater-meta-windows
          path: |
            dist/QwenPaw-Tauri-*-Windows-setup.exe.sig
            dist/tauri-windows-x86_64-updater.json

      - name: Upload GO CLAW update package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-claw-update-package-${{ steps.version.outputs.version }}
          path: |
            dist/GO-CLAW-Update-*-setup.exe
            dist/GO-CLAW-Update-*-setup.exe.sig
            dist/latest.json
          if-no-files-found: ignore

  build-tauri-macos:
    if: ${{ inputs.windows_only != true }}
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Get version
        id: version
        uses: ./.github/actions/get-version

      - name: Set up Python
        uses: actions/setup-python@v5
        env:
          PIP_NO_CACHE_DIR: "1"
        with:
          python-version: "3.11"

      - name: Install packaging helper dependencies
        run: python -m pip install packaging

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: console/src-tauri

      - name: Clean dist directory
        run: rm -rf dist && mkdir -p dist

      - name: Build Tauri macOS package
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          # Authenticate the python-build-standalone release lookup in
          # stage_python_runtime.py to avoid anonymous API rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          TAURI_UPDATER_ENDPOINTS: ${{ vars.TAURI_UPDATER_ENDPOINTS }}
        run: |
          chmod +x scripts/pack-tauri/build_macos_pyinstaller.sh
          bash scripts/pack-tauri/build_macos_pyinstaller.sh

      - name: Verify desktop (Tauri macOS)
        timeout-minutes: 10
        uses: ./.github/actions/verify-tauri-macos
        with:
          dashscope-api-key: ${{ secrets.QWENPAW_DASHSCOPE_API_KEY }}

      - name: Stop desktop server (Tauri macOS)
        if: always()
        run: |
          # Kill the Tauri shell and its sidecar subprocess.
          pkill -f "GO CLAW" 2>/dev/null || true
          pkill -f "qwenpaw-backend" 2>/dev/null || true
          sleep 2
          pkill -9 -f "GO CLAW" 2>/dev/null || true
          pkill -9 -f "qwenpaw-backend" 2>/dev/null || true
          # Best-effort: kill anything sitting on the detected port.
          if [ -n "${BASE_URL:-}" ]; then
            PORT="${BASE_URL##*:}"
            lsof -ti:"$PORT" | xargs kill 2>/dev/null || true
          fi
          rm -rf dist/verify-tauri

      - name: Upload desktop verify logs (Tauri macOS)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verify-logs-tauri-macos-${{ steps.version.outputs.version }}
          path: |
            ${{ runner.temp }}/qwenpaw-desktop-stdout.log
            ${{ runner.temp }}/qwenpaw-desktop-stderr.log
            ~/Library/Logs/com.qwenpaw.desktop/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload verify screenshots (Tauri macOS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verify-screenshots-tauri-macos-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/verify-screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Tauri macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: QwenPaw-Desktop-Tauri-macOS-${{ steps.version.outputs.version }}
          path: dist/QwenPaw-Tauri-*-macOS.zip

      - name: Upload Tauri macOS updater metadata
        uses: actions/upload-artifact@v4
        with:
          name: tauri-updater-meta-macos
          path: |
            dist/QwenPaw-Tauri-*-macOS.app.tar.gz
            dist/QwenPaw-Tauri-*-macOS.app.tar.gz.sig
            dist/tauri-darwin-*-updater.json
