name: PR preview tests

# GO CLAW repository-local manual preview of `.github/workflows/tests.yml`,
# without its `approval-gate`. It exists only for an explicit compatibility
# run inside `GresonKwan/GO-Claw-2.0`; it is not an upstream contribution
# workflow.
#
# Runs only on manual dispatch to avoid duplicating the normal PR matrix. It
# executes the same unit, contract, and integrated tiers, using the PR marker
# (`integration and p0`) for the integrated tier. Coverage/artifact upload is
# omitted because it is not a pass/fail gate. The npm console build is also
# omitted: tests under
# tests/unit / tests/contract / tests/integration do not import the built
# frontend static assets (verified); `console` is an API route name there, not
# console/dist.

on:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests - py${{ matrix.python-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Manual copy of this repository's tests.yml unit matrix.
        python-version: ["3.11", "3.13"]
        os: [ubuntu-latest]
        include:
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test,full]"

      - name: Run unit tests
        shell: bash
        run: pytest tests/unit -v

  contract-tests:
    name: Contract Tests - py${{ matrix.python-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Manual copy of this repository's tests.yml contract matrix.
        python-version: ["3.11", "3.13"]
        os: [ubuntu-latest]
        include:
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test,full]"

      - name: Run contract tests
        shell: bash
        run: pytest tests/contract -v

  integrated-tests:
    name: Integrated Tests - py${{ matrix.python-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Manual copy of this repository's tests.yml integrated matrix.
        python-version: ["3.11", "3.13"]
        os: [ubuntu-latest]
        include:
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test,full]"

      # Upstream gates the integrated tier with `-m "integration and p0"` for
      # The intent is the same pre-merge signal, so this manual job uses p0.
      # Windows keeps the lifted HTTP timeout from the canonical Tests matrix.
      - name: Run integrated tests
        shell: bash
        env:
          QWENPAW_INTEGRATION_HTTP_TIMEOUT: ${{ matrix.os == 'windows-latest' && '120' || '' }}
        run: |
          pytest tests/integration -v \
            -n auto --dist=loadscope --timeout=300 \
            -m "integration and p0"
