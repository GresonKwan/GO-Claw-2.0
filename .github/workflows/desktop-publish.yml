# Reusable "publish" half of the desktop release: take the desktop artifacts
# produced by desktop-build.yml (same run) and publish them.
#
# Called by release.yml during the gated publish phase. Performs two things:
#   - upload-release: attach the installers to the (draft) GitHub Release by tag
#     (this is safe to run on a fork, where it targets the fork's own release).
#   - upload-oss: push the VERSIONED files + metadata to the download OSS
#     bucket. The `latest` files, updater manifest and index are promoted
#     separately AFTER the release is published — see desktop-promote.yml.
#     Skipped when dry_run=true so fork verification never touches the shared
#     production bucket.

name: Desktop Publish (reusable)

on:
  workflow_call:
    inputs:
      tag:
        description: "Target (draft) release tag to attach assets to"
        type: string
        required: true
      ref:
        description: "Git ref/SHA to checkout for the packaging scripts"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Skip the production OSS upload (fork verification)"
        type: boolean
        required: false
        default: false
      build_run_id:
        description: "Desktop Build run containing the signed artifacts (empty = current run)"
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: "Target draft release tag to attach assets to"
        type: string
        required: true
      ref:
        description: "Git ref/SHA to checkout for the packaging scripts"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Skip the production OSS upload"
        type: boolean
        required: false
        default: true
      build_run_id:
        description: "Successful Desktop Build run containing the signed artifacts"
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  # ── Attach installers to the (draft) GitHub Release ────────────────────────
  upload-release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Validate explicit Desktop Build run
        if: ${{ inputs.build_run_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          EXPECTED_SHA: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          metadata="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}")"
          [ "$(jq -r '.conclusion' <<<"$metadata")" = "success" ] || {
            echo "::error::Desktop Build run ${BUILD_RUN_ID} is not successful"
            exit 1
          }
          [ "$(jq -r '.name' <<<"$metadata")" = "Desktop Build (reusable)" ] || {
            echo "::error::Run ${BUILD_RUN_ID} is not the Desktop Build workflow"
            exit 1
          }
          if [ -n "$EXPECTED_SHA" ] && [ "$(jq -r '.head_sha' <<<"$metadata")" != "$EXPECTED_SHA" ]; then
            echo "::error::Desktop Build run SHA does not match the requested release SHA"
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach signed GO CLAW Windows assets to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          copy_one() {
            local pattern="$1"
            mapfile -t matches < <(find . -type f -path "$pattern" -print)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one file for ${pattern}, found ${#matches[@]}"
              exit 1
            fi
            cp "${matches[0]}" .
          }
          copy_one './go-claw-windows-installer-*/GO-CLAW-Setup-*-Windows-x64.exe'
          copy_one './go-claw-windows-installer-*/GO-CLAW-Setup-*-Windows-x64.exe.sig'
          copy_one './go-claw-update-package-*/GO-CLAW-Update-*-setup.exe'
          copy_one './go-claw-update-package-*/GO-CLAW-Update-*-setup.exe.sig'
          copy_one './go-claw-update-package-*/latest.json'
          copy_one './go-claw-update-package-*/SHA256SUMS.txt'
          mapfile -t v2_assets < <(find ./go-claw-update-package-*/v2-assets -maxdepth 1 -type f -print | sort)
          if [ "${#v2_assets[@]}" -lt 20 ]; then
            echo "::error::Signed v2 component assets are incomplete (${#v2_assets[@]})"
            exit 1
          fi
          for asset in "${v2_assets[@]}"; do cp "$asset" .; done
          files=(
            GO-CLAW-Setup-*-Windows-x64.exe
            GO-CLAW-Setup-*-Windows-x64.exe.sig
            GO-CLAW-Update-*-setup.exe
            GO-CLAW-Update-*-setup.exe.sig
            latest.json
            SHA256SUMS.txt
            *.zip
            *.zip.sig
            windows-release-v2.json
            windows-release-v2.json.sig
            release-index-v2.json
            release-index-v2.json.sig
            release-catalog-v2.json
            release-catalog-v2.json.sig
          )
          sha256sum -c SHA256SUMS.txt

          release_json=$(gh release view "${{ inputs.tag }}" --json isDraft,assets --repo "$GITHUB_REPOSITORY")
          if [ "$(jq -r '.isDraft' <<<"$release_json")" != "true" ]; then
            echo "::error::Release ${{ inputs.tag }} is already published; assets are immutable"
            exit 1
          fi

          mapfile -t existing_assets < <(jq -r '.assets[].name' <<<"$release_json")
          for file in "${files[@]}"; do
            for existing in "${existing_assets[@]}"; do
              if [ "$existing" = "$file" ]; then
                echo "::error::Refusing to replace an existing release asset: $file"
                exit 1
              fi
            done
          done

          echo "Attaching to draft release ${{ inputs.tag }}: ${files[*]}"
          gh release upload "${{ inputs.tag }}" "${files[@]}" --repo "$GITHUB_REPOSITORY"

  # ── Publish files + updater metadata to OSS (skipped on dry_run) ───────────
  upload-oss:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    env:
      # GO CLAW is an independent downstream product.  Never inherit or fall
      # back to the upstream QwenPaw distribution endpoints.
      OSS_BUCKET: ${{ vars.GO_CLAW_OSS_BUCKET }}
      OSS_PUBLIC_BASE_URL: ${{ vars.GO_CLAW_OSS_PUBLIC_BASE_URL }}
    steps:
      - name: Checkout (for scripts)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging helper dependencies
        run: python -m pip install packaging

      - name: Get version
        id: version
        uses: ./.github/actions/get-version

      - name: Validate explicit Desktop Build run
        if: ${{ inputs.build_run_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          EXPECTED_SHA: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          metadata="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}")"
          [ "$(jq -r '.conclusion' <<<"$metadata")" = "success" ] || exit 1
          [ "$(jq -r '.name' <<<"$metadata")" = "Desktop Build (reusable)" ] || exit 1
          if [ -n "$EXPECTED_SHA" ] && [ "$(jq -r '.head_sha' <<<"$metadata")" != "$EXPECTED_SHA" ]; then
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate GO CLAW-owned OSS destination
        shell: bash
        env:
          OSS_ENDPOINT: ${{ secrets.GO_CLAW_OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.GO_CLAW_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.GO_CLAW_OSS_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          for value_name in OSS_BUCKET OSS_PUBLIC_BASE_URL OSS_ENDPOINT OSS_ACCESS_KEY_ID OSS_ACCESS_KEY_SECRET; do
            if [ -z "${!value_name:-}" ]; then
              echo "::error::${value_name} is required for GO CLAW OSS publishing"
              exit 1
            fi
          done
          destination="${OSS_BUCKET} ${OSS_PUBLIC_BASE_URL} ${OSS_ENDPOINT}"
          if grep -Eqi 'qwenpaw|agentscope' <<<"${destination}"; then
            echo "::error::Refusing to publish GO CLAW assets to an upstream QwenPaw/AgentScope destination"
            exit 1
          fi

      - name: Install ossutil
        run: |
          wget https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil-v1.7.18-linux-amd64.zip
          unzip ossutil-v1.7.18-linux-amd64.zip
          chmod +x ossutil-v1.7.18-linux-amd64/ossutil64
          sudo mv ossutil-v1.7.18-linux-amd64/ossutil64 /usr/local/bin/ossutil
          ossutil --version

      - name: Configure ossutil
        run: |
          ossutil config -e ${{ secrets.GO_CLAW_OSS_ENDPOINT }} \
            -i ${{ secrets.GO_CLAW_OSS_ACCESS_KEY_ID }} \
            -k ${{ secrets.GO_CLAW_OSS_ACCESS_KEY_SECRET }} \
            -L CH

      - name: Process and upload Tauri artifacts (versioned only)
        # Only versioned files are uploaded here. The `latest` files, updater
        # manifest and index are promoted AFTER the release is published — see
        # desktop-promote.yml — so the auto-updater is never pointed at a version
        # whose release/PyPI/Docker publish might still fail.
        if: hashFiles('go-claw-windows-installer-*/*') != '' || hashFiles('QwenPaw-Desktop-Tauri-macOS-*/*') != ''
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          upload_versioned() {
            local dirs="$1"
            local pattern="$2"
            local platform="$3"
            local versioned_name="$4"
            local metadata="$5"

            local artifact
            artifact=$(find ${dirs} -name "${pattern}" 2>/dev/null | head -1 || true)
            if [ -z "${artifact}" ]; then
              echo "No ${platform} Tauri artifact found, skipping"
              return 0
            fi

            echo "Processing ${platform} Tauri artifact: ${artifact}"
            python scripts/pack/generate_oss_metadata.py \
              --file "${artifact}" \
              --product desktop \
              --platform "${platform}" \
              --version "${VERSION}" \
              --output "${metadata}"

            ossutil cp "${artifact}" \
              "oss://${OSS_BUCKET}/files/apps/desktop/${platform}/${versioned_name}" \
              --acl public-read \
              --force
            ossutil cp "${metadata}" \
              "oss://${OSS_BUCKET}/metadata/apps/desktop/${platform}/${versioned_name}.json" \
              --acl public-read \
              --force
          }

          upload_versioned \
            "go-claw-windows-installer-*" \
            "GO-CLAW-Setup-*-Windows-x64.exe" \
            "win-tauri" \
            "GO-CLAW-Setup-${VERSION}-Windows-x64.exe" \
            "win-tauri-metadata.json"

          upload_versioned \
            "QwenPaw-Desktop-Tauri-macOS-*" \
            "QwenPaw-Tauri-*-macOS.zip" \
            "mac-tauri" \
            "QwenPaw-Tauri-${VERSION}-macOS.zip" \
            "mac-tauri-metadata.json"

      - name: Upload Tauri macOS updater archive to OSS
        # The .zip is for first-install; the auto-updater pulls .app.tar.gz.
        if: hashFiles('tauri-updater-meta-macos/*.app.tar.gz') != ''
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP_TAR_GZ=$(find tauri-updater-meta-macos -name "QwenPaw-Tauri-*-macOS.app.tar.gz" | head -1)
          if [ -z "$APP_TAR_GZ" ]; then
            echo "No macOS .app.tar.gz found, skipping"
            exit 0
          fi
          ossutil cp "$APP_TAR_GZ" \
            "oss://${OSS_BUCKET}/files/apps/desktop/mac-tauri/QwenPaw-Tauri-${VERSION}-macOS.app.tar.gz" \
            --acl public-read \
            --force

      # NOTE: the `latest` files, the updater manifest
      # (qwenpaw-tauri-latest.json) and the index are intentionally NOT uploaded
      # here. They are promoted only AFTER the release is flipped to published —
      # see desktop-promote.yml — so existing users' auto-updater is never
      # pointed at a version whose release might still fail to publish.
