# Include inside the existing TLS server. Never enable before staging approval.
location ^~ /go-claw/provision/billing/ {
    client_max_body_size 16k;
    limit_req zone=go_claw_billing_enrollment burst=5 nodelay;
    proxy_pass http://127.0.0.1:9100;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    access_log off;
}

location = /go-claw/billing/webhooks/wechatpay/transactions {
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:9200/webhooks/wechatpay/transactions;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Wechatpay-Timestamp $http_wechatpay_timestamp;
    proxy_set_header Wechatpay-Nonce $http_wechatpay_nonce;
    proxy_set_header Wechatpay-Serial $http_wechatpay_serial;
    proxy_set_header Wechatpay-Signature $http_wechatpay_signature;
    proxy_request_buffering on;
    access_log off;
}

location = /go-claw/billing/webhooks/wechatpay/refunds {
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:9200/webhooks/wechatpay/refunds;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Wechatpay-Timestamp $http_wechatpay_timestamp;
    proxy_set_header Wechatpay-Nonce $http_wechatpay_nonce;
    proxy_set_header Wechatpay-Serial $http_wechatpay_serial;
    proxy_set_header Wechatpay-Signature $http_wechatpay_signature;
    proxy_request_buffering on;
    access_log off;
}

location ^~ /go-claw/billing/internal/ {
    return 404;
}

location ^~ /go-claw/billing/ {
    client_max_body_size 64k;
    limit_req zone=go_claw_billing_customer burst=10 nodelay;
    proxy_pass http://127.0.0.1:9200/;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 25s;
    access_log off;
}
