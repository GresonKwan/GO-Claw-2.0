# Load in the nginx http context before go-claw-billing.conf is included by a
# TLS server.  The application also enforces durable enrollment and account
# limits; these zones only absorb bursts at the edge.
limit_req_zone $binary_remote_addr zone=go_claw_billing_enrollment:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=go_claw_billing_customer:10m rate=20r/s;
