# GO CLAW public surface on TCP 8443.
#
# This file is the complete server block for
# /etc/nginx/conf.d/newapi-8443.conf.  The rate-limit zone used by the two
# enrollment endpoints must be loaded in the nginx http context from
# go-claw-billing-zones.conf.  Customer billing APIs and WeChat callbacks stay
# on the port-443 server and MUST NOT be included here.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name goclaw.host;

    ssl_certificate /etc/letsencrypt/live/goclaw.host/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goclaw.host/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NEWAPI_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 64m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location = /go-claw/quota {
        proxy_pass http://127.0.0.1:9100/api/quota;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /go-claw/provision {
        proxy_pass http://127.0.0.1:9100/api/provision;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Existing clients enroll the local billing profile through these two
    # exact paths.  Do not broaden this to /go-claw/provision/billing/.
    location = /go-claw/provision/billing/challenges {
        client_max_body_size 16k;
        limit_req zone=go_claw_billing_enrollment burst=5 nodelay;
        proxy_pass http://127.0.0.1:9100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        access_log off;
    }

    location = /go-claw/provision/billing/enrollments {
        client_max_body_size 16k;
        limit_req zone=go_claw_billing_enrollment burst=5 nodelay;
        proxy_pass http://127.0.0.1:9100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        access_log off;
    }

    # Keep the historically blocked registration endpoint explicit, then
    # fail closed for every other New API management endpoint.
    location = /api/user/register {
        return 403;
    }

    location = /api {
        return 404;
    }

    location ^~ /api/ {
        return 404;
    }

    location ^~ /updates-staging/ {
        root /srv/go-claw-updates;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /updates/ {
        root /srv/go-claw-updates;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # OpenAI-compatible model traffic is the only public New API surface.
    location = /v1 {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # New API's admin UI, public health probes and unknown paths are private.
    location / {
        return 404;
    }
}
