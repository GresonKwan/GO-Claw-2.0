[package]
name = "qwenpaw-desktop"
default-run = "qwenpaw-desktop"
version = "0.1.0"
description = "GO CLAW desktop shell that runs the local core and opens the client."
authors = ["GO CLAW Contributors"]
license = "Apache-2.0"
repository = "https://github.com/GresonKwan/GO-Claw-2.0.git"
edition = "2021"
rust-version = "1.88"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dev-dependencies]
tempfile = "3"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["stream", "blocking", "rustls-tls"] }
semver = "1"
base64 = "0.22"
minisign-verify = "0.2.5"
sha2 = "0.10"
tauri = { version = "2.10.3", features = ["tray-icon", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "rt", "net"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_System_LibraryLoader", "Win32_Security"] }
