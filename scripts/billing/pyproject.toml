[project]
name = "go-claw-billing"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "argon2-cffi>=23.1.0",
  "cryptography>=44.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "psycopg[binary,pool]>=3.2.0",
  "pydantic-settings>=2.7.0",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=0.25"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
